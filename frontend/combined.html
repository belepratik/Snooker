<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="combined.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.0.2/css/bootstrap.min.css">
    <link rel="icon"
        href="https://github.com/AnkitBele21/centurydewas/blob/updateframedata/photo/Thumbnail.jpg?raw=true"
        type="image/x-icon">
    <title>Club Frames and Players</title>
</head>

<body>
    <header class="d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
            <img src="https://img1.wsimg.com/isteam/ip/9e11a5db-9940-4d56-b773-7f8426617dc8/Frame%2012995%20(1).png/:/cr=t:0%25,l:0%25,w:100%25,h:100%25"
                alt="SnookerPlus Logo" id="logo">
            <h1>Club Frames and Players</h1>
        </div>
    </header>
    <div id="main-content">
        <iframe id="clubFrames"  class="split-frame"></iframe>
        <iframe id="clubPlayers"  class="split-frame"></iframe>
    </div>
</body>
<script>
    function getParameterByName(name, url = window.location.href) {
        name = name.replace(/[\[\]]/g, '\\$&');
        const regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)');
        const results = regex.exec(url);
        if (!results) return null;
        if (!results[2]) return '';
        return decodeURIComponent(results[2].replace(/\+/g, ' '));
    }

    const studio = getParameterByName('studio');
    const security = getParameterByName('security');
    const query_param = `?studio=${studio}&security=${security}`;

    document.getElementById('clubFrames').src = '/frame' + query_param;
    document.getElementById('clubPlayers').src = '/players' + query_param;



</script>

</html>
