<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <link rel="icon" href="https://github.com/AnkitBele21/centurydewas/blob/updateframedata/photo/Thumbnail.jpg?raw=true" type="image/x-icon"> 
    <link rel="stylesheet" href="player_details.css">
    <title>Player Details</title>
    <style>
        /* Additional custom styles */
        .frames-header {
            text-align: center;
            margin: 20px 0 10px;
            font-weight: bold;
            font-size: 1.2rem;
            color: #ffffff;
        }
        #framesContainer {
            background-color: #2c3034;
            padding: 15px;
            border-radius: 8px;
            margin: 0 auto 20px;
            max-width: 540px;
        }
        /* Modal styles */
        .modal-content {
            background-color: #2c3034;
            border: 1px solid #444;
        }
        .table-dark {
            background-color: #343a40;
        }
        .table-hover tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.075);
        }
        .text-success {
            color: #28a745 !important;
        }
        .text-danger {
            color: #dc3545 !important;
        }
        .table-responsive {
            max-height: 60vh;
            overflow-y: auto;
        }
        .club-player-rank {
            width: 40px;
            text-align: center;
        }
        .club-player-name {
            min-width: 120px;
        }
        .club-player-coins {
            text-align: right;
        }
        
        /* Action buttons container */
        .action-buttons {
            max-width: 540px;
            margin: 0 auto 20px;
        }
        
        /* Loading spinner for My Club button */
        #myClubBtn.loading {
            position: relative;
            pointer-events: none;
        }
        #myClubBtn.loading:after {
            content: "";
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            border: 2px solid transparent;
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: translateY(-50%) rotate(0deg); }
            100% { transform: translateY(-50%) rotate(360deg); }
        }
        
        /* Highlight for current player in club table */
        .table-primary {
            background-color: rgba(13, 110, 253, 0.3) !important;
        }
    </style>
</head>
<body>
    <header class="text-center py-3">
        <img src="https://github.com/AnkitBele21/centurydewas/blob/main/photo/logo%20(1).png?raw=true" alt="Logo" id="logo" class="img-fluid">
    </header>
    
    <div class="alert alert-danger text-center" id="warning" style="display: none;">Warning: Your balance is above 2000. Please clear dues ASAP!</div>
    
    <div id="playerCard" class="card mb-3 mx-auto" style="max-width: 540px;">
        <div class="card-body" id="playerInfo">
            <h2 id="playerName" class="card-title">---</h2>
            <p id="playerRank" class="card-text">Rank: -</p>
            <p id="winRate" class="card-text">Win Rate: -%</p>
            <p id="totalMoney" class="card-text balance positive">Balance: --</p>
            <div class="nfcLockToggle">
                <span id="nfcLockText">NFC Lock</span>
                <label class="toggle-switch">
                    <input type="checkbox" class="toggle-input" id="nfcLockToggle">
                    <span class="toggle-slider"></span>
                </label>
            </div>

        </div>
    </div>
    
    <!-- Action Buttons moved here -->
    <div class="action-buttons d-flex gap-2">
        <a href="#" class="btn btn-outline-primary flex-grow-1" id="seeTransactions">Transactions</a>
        <button class="btn btn-primary flex-grow-1" id="myClubBtn">My Club</button>
    </div>
    
    <div id="framesContainer" class="mx-auto">
        <div class="frames-header">Recent Frames</div>
        <div id="framesInfo"></div>
    </div>

    <!-- Transactions Modal -->
    <div class="modal fade" id="transactionsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">Transaction History</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="table-responsive">
                        <table class="table table-dark table-hover">
                            <thead>
                                <tr>
                                    <th>Date & Time</th>
                                    <th>Amount (₹)</th>
                                    <th>Payment Mode</th>
                                </tr>
                            </thead>
                            <tbody id="transactionsTable">
                                <!-- Transactions will load here -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- My Club Modal -->
    <div class="modal fade" id="clubModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">My Club Players</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="table-responsive">
                        <table class="table table-dark table-hover">
                            <thead>
                                <tr>
                                    <th class="club-player-rank">Rank</th>
                                    <th class="club-player-name">Player</th>
                                    <th class="club-player-coins">Coins</th>
                                    <th>Win Rate</th>
                                </tr>
                            </thead>
                            <tbody id="clubPlayersTable">
                                <!-- Club players will load here -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="loader.js"></script>
    <script src="player_details.js"></script>
</body>
</html>
