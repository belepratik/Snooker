<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Frame</title>
    <link rel="stylesheet" href="updateactiveframe.css">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="icon" href="https://github.com/AnkitBele21/centurydewas/blob/updateframedata/photo/Thumbnail.jpg?raw=true" type="image/x-icon"> 
    <style>
        /* Change the background color of the dropdown */
        .select2-container--default .select2-results__option {
            background-color: #394045;
            color: white;
        }

        /* Change the background color of the selected option */
        .select2-container--default .select2-results__option--highlighted[aria-selected] {
            background-color: #2a2a2a;
            color: white;
        }

        /* Change the background color of the select box */
        .select2-container--default .select2-selection--single {
            background-color: #394045;
            color: white;
            border: 1px solid #aaa;
        }

        /* Change the color of the placeholder */
        .select2-container--default .select2-selection__placeholder {
            color: white;
        }
        /* change the color of the selected option  */
        .select2-container--default .select2-selection--single .select2-selection__rendered{
            color: white;
        }
    </style>
</head>

<body>
    <header class="header">
        <img src="https://img1.wsimg.com/isteam/ip/9e11a5db-9940-4d56-b773-7f8426617dc8/Frame%2012995%20(1).png/:/cr=t:0%25,l:0%25,w:100%25,h:100%25" alt="SnookerPlus Logo">
        <h1>Update Frame</h1>
    </header>
    <div class="form-container">
        <form id="updateFrameForm" > 
            <!-- onsubmit="return validateForm() -->
            <div class="frame-id-container">
                <label for="frameNo">Frame ID:</label>
                <span id="frameNo"></span> <!-- Frame ID will be displayed here -->
            </div>

            <label for="tableNo">Table No.:</label>
            <select id="tableNo" name="tableNo" required>
                <option value="" disabled selected>Select Table No.</option>
                <!-- Table numbers will be dynamically added here -->
            </select><br>
            <div class="rateType">
                <p>Choose Rate Type :</p>
                <div class="rate">
                    <div class="rateRadio">
                        <label for="rateType">Time Wise</label>
                        <input type="radio" name="rateType" id="unfixed" value=0 checked>
                    </div>
                    <div class="rateRadio">
                        <label for="rateType">Frame Wise</label>
                        <input type="radio" name="rateType" id="fixed" value=1>
                    </div>
                </div>
            </div>
            <label for="startTime">Start Time:</label>
            <input type="datetime-local" id="startTime" name="startTime"  />

            <div class="players-section">
                <label for="players">Players:</label>
                <div id="playersContainer">
                    <!-- Player input boxes will be dynamically added here -->
                </div>
                <button type="button" id="addPlayerButton">Add Player</button>
            </div>

            <datalist id="playerNames"></datalist>

            <div class="form-buttons">
                <button type="button" class="back-button" onclick="goBack()">Back</button>
                <input type="submit" value="Submit">
            </div>
        </form>
    </div>

    <script src="loader.js" defer></script>
    <script src="updateactiveframe.js" defer></script>

    <script>
        function validateForm() {
            const tableNo = document.getElementById('tableNo').value;
            if (tableNo === "") {
                alert("Please select a Table No.");
                return false;
            }
            return true;
        }
    </script>
</body>

</html>
