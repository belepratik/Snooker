<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tv.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Snooker Tables Status</title>
</head>
<body>
    <div class="overlay">
        
    </div>
    <div class="header">
        <div class="club-info">
            <img src="" alt="Club Logo" class="club-logo">
            <h1 class="club-name">Loading...</h1>
        </div>
        
        <div class="current-time">
            <span id="clock">00:00:00</span>
        </div>
    </div>

    <div class="container">
        <h2 class="tables-heading">Table Status</h2>
        <div id="tableContainer" class="table-grid"></div>
    </div>

    <div class="branding">
        <div class="powered-by">Powered by</div>
        <img src="https://github.com/AnkitBele21/centurydewas/blob/main/photo/logo%20(1).png?raw=true" alt="Snooker+ Logo" class="snooker-logo">
    </div>



    <script src="tv.js"></script>
</body>
</html>
