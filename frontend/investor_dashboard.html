<!DOCTYPE html>
<html lang="en">
<head>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="club_dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Investor Dashboard</title>
</head>
<body>
    <header>
        <div class="header-content">
            <img src="https://img1.wsimg.com/isteam/ip/9e11a5db-9940-4d56-b773-7f8426617dc8/Frame%2012995%20(1).png/:/cr=t:0%25,l:0%25,w:100%25,h:100%25" alt="SnookerPlus Logo" id="logo">
            <h1 id="heading">Investor Dashboard</h1>
        </div>
        <button id="framesButton" class="btn btn-primary">Frames</button>
    </header>
    <main>
        <section id="clubDetails" class="card">
            <h2>Club Details</h2>
            <div class="format">
                <div class="filter">
                    <h3>Total</h3>
                    <label class="switch">
                        <input type="checkbox" id="toggle">
                        <span class="slider round"></span>
                    </label>
                    <h3>Datewise</h3>
                </div>
                <div class="date">
                    <input type="date" name="dateFilter" id="dateFilter">
                </div>
            </div>
            <div id="clubDetail"></div>
        </section>
        <section id="analytics">
            <canvas id="tableWisePerformanceChart" width="400" height="200"></canvas>
            <canvas id="slotWisePerformanceChart" width="400" height="200"></canvas>
            <canvas id="dateWisePerformanceChart" width="400" height="200"></canvas>
        </section>
    </main>
    <script src="investor_dashboard.js"></script>
</body>
</html>
