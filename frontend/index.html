<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-481JRCY8MD"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-481JRCY8MD');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Snooker+ Leaderboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="https://github.com/AnkitBele21/centurydewas/blob/updateframedata/photo/Thumbnail.jpg?raw=true" type="image/x-icon">

    <link rel="stylesheet" href="index.css">
</head>

<body class="bg-dark text-light">

    <!-- HEADER -->
    <header class="py-3 text-center">
        <img 
            src="https://github.com/AnkitBele21/centurydewas/blob/main/photo/logo%20(1).png?raw=true"
            alt="Snooker+ Logo"
            class="img-fluid"
            style="max-width: 160px; height: auto;"
        >
    </header>

    <!-- ANNOUNCEMENTS/NEWS TICKER BANNER -->
    <!-- PROMO BANNER IMAGE -->
    <div class="promo-banner-img-wrap">
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80" alt="Promotion" class="promo-banner-img">
    </div>
    <!-- NEWS TICKER -->
    <div class="promo-banner-ticker">
        <marquee behavior="scroll" direction="left" scrollamount="6" class="news-ticker">
            🎉 New Tournament this Sunday! | 💰 Top up your coins for bonus rewards! | 🏆 Congratulations to last week's champion! | 📢 Follow us on Instagram @snookerplus
        </marquee>
    </div>

        <!-- MODERN CENTERED SEARCH BAR -->
        <div class="searchbar-outer">
            <div class="search-bar">
                <img src="./public/search.png" class="search-icon-inside" alt="search">
                <input 
                    type="text"
                    id="searchInput"
                    placeholder="Search players..."
                    oninput="searchTable()"
                >
            </div>
        </div>

    <!-- FILTERS + CHAMPIONS BUTTON -->
    <section class="container top-controls mb-3">

        <div class="filter-row">

            <div class="active-wrapper">
                <input type="checkbox" class="form-check-input" id="showActivePlayers">
                <label for="showActivePlayers">Active Players</label>
            </div>

            <select id="studioName" class="studio-dropdown">
                <option value="" disabled selected>Select Studio</option>
                <option value="">All</option>
            </select>

        </div>

        <button 
            class="btn champions-btn w-100 mt-3"
            id="championsButton"
            data-active="false"
        >
            Snooker+ Champions
        </button>

    </section>

    <!-- MAIN CONTENT -->
    <main class="px-3 pb-5">

        <!-- Loading screen -->
        <div id="loadingContainer" class="loading-container">
            <div class="spinner-border text-success" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <div id="loadingMessage" class="loading-message"></div>
        </div>

        <!-- Club Banner Image (appears when studio is selected) -->
        <div id="clubBannerContainer" style="display:none; justify-content:center; align-items:center; margin: 20px 0;">
            <img id="clubBannerImg" src="" alt="Club Banner" style="max-width:100%; height:auto; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.1);">
        </div>

        <!-- Player cards container -->
        <div id="playerContainer" style="display:none;"></div>

    </main>

    <!-- Loading Messages -->
    <script>
        const loadingMessages = [
            "Racking up the latest scores...",
            "Calculating break points...",
            "Chalking up the leaderboard...",
            "Setting up the perfect angle...",
            "Finding the next century break...",
            "Aligning the cue of champions...",
            "Potting the final data balls...",
            "Measuring the perfect spin...",
            "Calculating positional play stats...",
            "Setting up for a maximum break..."
        ];
        document.addEventListener("DOMContentLoaded", () => {
            const msg = document.getElementById("loadingMessage");
            msg.textContent = loadingMessages[Math.floor(Math.random() * loadingMessages.length)];
        });
    </script>

    <!-- JS Logic -->
    <script src="datapull.js"></script>
</body>
</html>
