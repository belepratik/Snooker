<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-481JRCY8MD"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() {
            dataLayer.push(arguments);
        }
        gtag('js', new Date());
        gtag('config', 'G-481JRCY8MD');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snooker Plus Leaderboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="https://github.com/AnkitBele21/centurydewas/blob/updateframedata/photo/Thumbnail.jpg?raw=true"
        type="image/x-icon">
    <link rel="stylesheet" href="index.css">
    <style>
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            gap: 1rem;
            color: #333;
            font-size: 1.2rem;
            text-align: center;
            min-height: 200px;
        }
        .loading-message {
            min-height: 2.5rem;
            font-style: italic;
        }
    </style>
</head>

<body>
    <header>
        <img src="https://github.com/AnkitBele21/centurydewas/blob/main/photo/Banner%20Image%201.png?raw=true"
            alt="Snooker Plus Logo" class="img-fluid">
    </header>

    <main class="px-3 py-4">
        <div class="toolbar d-flex flex-column flex-md-row justify-content-between align-items-center mb-4">
            <!-- Search Bar -->
            <div class="search d-flex align-items-center mb-2 mb-md-0">
                <img src="./public/search.png" alt="search" id="search_icon" class="search-icon">
                <input type="text" id="searchInput" oninput="searchTable()" placeholder="Search for players..."
                    class="form-control">
            </div>
        </div>

        <!-- Filters Section (Active Players & My Club) -->
        <div class="filters d-flex flex-column flex-md-row justify-content-between align-items-center mb-4">
            <div class="form-check mb-2 mb-md-0">
                <input class="form-check-input" type="checkbox" id="showActivePlayers" onchange="togglePlayingNowPlayers()">
                <label class="form-check-label" for="showActivePlayers">
                    Active Players
                </label>
            </div>

            <select name="studioName" id="studioName" onchange="studioFilter()" class="form-select mb-2 mb-md-0">
                <option value="" disabled selected>Select Studio</option>
                <option value="">All</option>
            </select>
        </div>

        <!-- Snooker+ Champions Section -->
        <div class="snooker-champions mb-4">
            <button class="btn btn-outline-primary" id="championsButton" onclick="toggleChampions()" data-active="false">Snooker+ Champions</button>
        </div>

        <!-- Loading Container (visible by default) -->
        <div id="loadingContainer" class="loading-container">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <div id="loadingMessage" class="loading-message">
                <!-- Message will be inserted by JavaScript -->
            </div>
        </div>
        
        <!-- Player Container (hidden by default) -->
        <div id="playerContainer" style="display: none;"></div>
    </main>

    <script>
        // Array of creative loading messages
        const loadingMessages = [
            "Racking up the latest scores...",
            "Calculating break points...",
            "Chalking up the leaderboard...",
            "Setting up the perfect angle...",
            "Finding the next century break...",
            "Aligning the cue of champions...",
            "Potting the final data balls...",
            "Measuring the perfect spin...",
            "Calculating positional play stats...",
            "Setting up for a maximum break..."
        ];

        // Function to show random loading message
        function showRandomLoadingMessage() {
            const randomIndex = Math.floor(Math.random() * loadingMessages.length);
            document.getElementById('loadingMessage').textContent = loadingMessages[randomIndex];
        }

        // Set random message when page loads
        document.addEventListener('DOMContentLoaded', showRandomLoadingMessage);
    </script>

    <script src="datapull.js"></script>
</body>
</html>
