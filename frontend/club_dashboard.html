<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline';">
    <link rel="stylesheet" href="club_dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/5.0.0-beta3/css/bootstrap.min.css">
    <title>Club Dashboard</title>
</head>

<body>
    <header>
        <div class="header-content">
            <img src="https://img1.wsimg.com/isteam/ip/9e11a5db-9940-4d56-b773-7f8426617dc8/Frame%2012995%20(1).png/:/cr=t:0%25,l:0%25,w:100%25,h:100%25"
                alt="SnookerPlus Logo" id="logo">
            <h1 id="heading"></h1>
        </div>
        <button id="framesButton" class="btn btn-primary">Frames</button>
    </header>
    <main>
        <section id="clubDetails" class="card">
            <h2>Club Details</h2>
            <div class="format">
                <div class="filter">
                    <h3>Total</h3>
                    <label class="switch">
                        <input type="checkbox" id="toggle">
                        <span class="slider round"></span>
                    </label>
                    <h3>Datewise</h3>
                </div>
                <div class="date">
                    <input type="date" name="dateFilter" id="dateFilter">
                </div>
            </div>

            <div id="clubDetail"></div>
            <!-- Club details will be dynamically added here via JavaScript -->
        </section>
        <section id="analytics">
            <canvas id="tableWisePerformanceChart" width="400" height="200"></canvas>
            <canvas id="slotWisePerformanceChart" width="400" height="200"></canvas>
            <canvas id="dateWisePerformanceChart" width="400" height="200"></canvas>
        </section>
    </main>
    <script src="club_dashboard.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('framesButton').addEventListener('click', function () {
                const studio = getCookie('studio');
                const security = getCookie('security');
                window.location.assign('/frame');
            });
        });
    </script>
</body>

</html>
